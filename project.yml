name: TravelEase
options:
  bundleIdPrefix: com.yaochangyu
  xcodeVersion: "16.0"
  deploymentTarget:
    iOS: "17.0"

targets:
  TravelEase:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/TravelEase
      - path: Sources/TravelEaseApp
    settings:
      base:
        PRODUCT_NAME: TravelEase
        PRODUCT_BUNDLE_IDENTIFIER: com.yaochangyu.TravelEase
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: "TravelEase"
