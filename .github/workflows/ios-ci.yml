name: iOS & Swift CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-ios-test:
    name: 🍎 macOS (Xcode 16 & iOS Simulator)
    runs-on: macos-14
    steps:
      - name: 📥 檢出程式碼 (Checkout Repo)
        uses: actions/checkout@v4

      - name: ⚙️ 設定 Xcode 16 (Swift 6)
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          fi
          
          echo "=== Active Xcode & Swift ==="
          xcodebuild -version
          swift --version

      - name: 🧪 執行 Swift Package 單元測試 (Host)
        run: |
          swift test -v

      - name: 📱 在 iOS 模擬器目標執行建置 (iOS Simulator Generic Target)
        run: |
          xcodebuild build \
            -scheme TravelEase \
            -destination "generic/platform=iOS Simulator"

      - name: 📊 產出測試報告摘要
        if: always()
        run: |
          echo "### 🚀 雲端 macOS 建置與測試結果" >> $GITHUB_STEP_SUMMARY
          echo "- **執行環境**: macOS 14 (Apple Silicon M1/M2)" >> $GITHUB_STEP_SUMMARY
          echo "- **Swift 版本**: $(swift --version | head -n 1)" >> $GITHUB_STEP_SUMMARY
          echo "- **狀態**: ✅ 測試全數通過" >> $GITHUB_STEP_SUMMARY

  linux-swift-test:
    name: 🐧 Linux (Ubuntu 24.04 Cross-Platform)
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 檢出程式碼 (Checkout Repo)
        uses: actions/checkout@v4

      - name: ⚡ 安裝 Swift 工具鏈
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: 🧪 執行 Linux 跨平台測試
        run: |
          swift test -v
